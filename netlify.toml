[build]
  command = "npm run build"
  publish = "out"

# Every page is now exported as its own HTML file (/about → about.html), so
# no SPA catch-all redirect is needed. Unknown URLs get Next's 404.html with
# a real 404 status instead of a soft-404 index page.

# Hashed build assets never change — cache them forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
